              { "@type": "Question", "name": "Qui présente mon activité pendant le live ?", "acceptedAnswer": { "@type": "Answer", "text": "C'est vous, l'entrepreneur, qui présentez directement votre activité, vos produits et vos services. OCD prépare le cadre, assure la régie et vous accompagne techniquement pendant la diffusion." } },
