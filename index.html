          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Quelle est la différence entre le Live en Présentiel et le Live à Distance ?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "En Présentiel, vous venez physiquement avec vos produits dans les locaux de Bovann Shop au Togo, accueilli par notre équipe et nos assistantes des lives OCD. À Distance (Cameroun, Tchad, Centrafrique, reste de l'Afrique et international), vous participez depuis votre boutique ou domicile tandis qu'une assistante des lives OCD présente au Togo vous accompagne, co-anime et porte votre activité tout au long du direct."
                }
              },
              {
                "@type": "Question",
                "name": "Quel est le rôle exact de l'assistante des lives OCD ?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Véritable ambassadrice commerciale de votre passage, votre assistante des lives OCD prépare votre intervention avant l'antenne, co-anime la présentation de vos produits, interagit avec les commentaires des internautes et rappelle régulièrement votre nom d'entreprise, vos numéros de téléphone et votre adresse physique — particulièrement précieux lorsque vous participez à distance depuis un autre pays."
                }
              },
              {
                "@type": "Question",
                "name": "À partir de quelle date puis-je réserver un créneau ?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Le calendrier interactif ouvre les réservations à partir du 1er décembre (selon le planning officiel administré par l'équipe OCD Live). Les dates disponibles, partiellement réservées ou complètes s'affichent en temps réel."
                }
              },
              {
                "@type": "Question",
                "name": "Comment le système évite-t-il les doubles réservations ?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Dès qu'un créneau horaire (1h30, 2h ou 4h) est réservé par un entrepreneur, il est immédiatement verrouillé dans notre base de données et ne peut plus être sélectionné par un autre participant sur la même plage horaire."
                }
              },
              {
                "@type": "Question",
                "name": "L'objectif est-il uniquement de vendre pendant le direct ?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Non : au-delà des ventes immédiates pendant le live, OCD Live est avant tout un outil puissant de communication et de visibilité commerciale pour faire connaître votre entreprise, présenter votre adresse physique, diffuser vos numéros de téléphone et attirer durablement de nouveaux clients."
                }
              },
              {
                "@type": "Question",
                "name": "Quelles sont les 6 formules commerciales proposées ?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "OCD Live propose 6 packages progressifs : Formule Découverte (1h30), Formule Business (1h30 + pack visibilité contacts & stories), Visibilité Renforcée (2h + affiche & publication), Immersion 4 Heures (tarif avantageux), Formule VIP Projecteur (4h + annonce officielle 48h avant) et Partenaire Mensuel (4 lives dans le mois)."
                }
              },
              {
                "@type": "Question",
                "name": "Que se passe-t-il juste après la validation de ma réservation ?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Vous obtenez immédiatement votre référence officielle de suivi (téléchargeable en .txt et ajoutable à votre agenda téléphone) et l'administration OCD Live reçoit instantanément votre notification complète pour valider votre passage et organiser le briefing."
                }
              },
              {
                "@type": "Question",
                "name": "Comment suivre ou modifier ma réservation ?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Vous pouvez consulter à tout moment le statut de votre dossier grâce au bouton « Suivre ma réservation » avec votre code de référence (ex. OCD-20261205-XXXX), ou contacter directement l'équipe sur WhatsApp au +228 79 79 02 29."
                }
              }
